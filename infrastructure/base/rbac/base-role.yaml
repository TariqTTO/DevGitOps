apiVersion: v1
kind: ServiceAccount
metadata:
  name: datauniverse-service-account
  namespace: datauniverse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: datauniverse
  name: datauniverse-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datauniverse-rolebinding
  namespace: datauniverse
subjects:
- kind: ServiceAccount
  name: datauniverse-service-account
  namespace: datauniverse
roleRef:
  kind: Role
  name: datauniverse-role
  apiGroup: rbac.authorization.k8s.io 