apiVersion: apps/v1
kind: Deployment
metadata:
  name: datauniverse-app
  labels:
    app: datauniverse-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: datauniverse-app
  template:
    metadata:
      labels:
        app: datauniverse-app
    spec:
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 8080
        resources: {}